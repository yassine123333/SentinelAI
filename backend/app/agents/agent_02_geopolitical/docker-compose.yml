version: "3.9"

# ============================================================
# GeoKG-RAG Full Infrastructure Stack
# Run: docker compose up -d
# ============================================================

services:

  # ── Neo4j Knowledge Graph ───────────────────────────────────
  neo4j:
    image: neo4j:5.15
    container_name: geokg_neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: "neo4j/yourpassword"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: "2G"
      NEO4J_dbms_memory_heap_initial__size: "1G"
      NEO4J_dbms_memory_heap_max__size: "4G"
      # Allow APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Weaviate Vector DB ──────────────────────────────────────
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.1
    container_name: geokg_weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: "none"
      # Vectors are generated externally by gemini_client.py
      CLUSTER_HOSTNAME: "weaviate"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Kafka + Zookeeper (Message Queue) ──────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: geokg_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: geokg_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka
    restart: unless-stopped

  # ── GeoKG-RAG API ───────────────────────────────────────────
  geokg_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geokg_api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "yourpassword"
      WEAVIATE_URL: "http://weaviate:8080"
      WEAVIATE_KEY: ""
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    depends_on:
      neo4j:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    command: ["python", "main.py", "server", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # ── Prometheus Monitoring ───────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: geokg_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  # ── Grafana Dashboard ───────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.0
    container_name: geokg_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  weaviate_data:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:
