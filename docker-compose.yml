services:
  neo4j:
    image: neo4j:5.15
    container_name: sentinelai-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-sentinelai2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelai-backend
    env_file:
      - ./backend/.env
    environment:
      # Neo4j — override localhost URI with Docker service name
      - NEO4J_URI=bolt://neo4j:7687
      # SOC Security Daemon — container-safe defaults
      # Nginx and Azure NSG blocking disabled (no nginx sidecar in this compose)
      # The daemon still runs, detects threats, and logs to MongoDB (audit mode)
      - BLOCK_LAYER_NGINX=false
      - BLOCK_LAYER_AZURE=false
      - BLOCK_DRY_RUN=false
      - SOC_POLL_INTERVAL=10
      - SOC_RATE_THRESHOLD=30
      - SOC_AUTH_FAIL_THRESH=5
      - SOC_UA_ROTATION_THRESH=3
      - SOC_ENABLE_MONGO_PROFILING=false
      - NGINX_LOG_PATH=/var/log/nginx/access.log
    volumes:
      # Persist Qdrant vector store (agent_03_sentiment uses local file-based Qdrant)
      - qdrant_data:/app/app/agents/agent_03_sentiment/qdrant_data
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelai-frontend
    env_file:
      - ./frontend/.env
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: sentinelai-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - production

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  qdrant_data:
  caddy_data:
  caddy_config:
