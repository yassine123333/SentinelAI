services:
  neo4j:
    image: neo4j:5.15
    container_name: sentinelai-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-sentinelai2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.1
    container_name: sentinelai-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=none
      - CLUSTER_HOSTNAME=weaviate
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  neo4j-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelai-neo4j-seed
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-12345678}
    working_dir: /app/app/agents/agent_02_geopolitical
    command: ["python", "scripts/seed_historical.py", "--limit", "1000"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"
    profiles:
      - init

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelai-backend
    env_file:
      - ./backend/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_KEY=
      - BLOCK_LAYER_NGINX=false
      - BLOCK_LAYER_AZURE=false
      - BLOCK_DRY_RUN=false
      - SOC_POLL_INTERVAL=10
      - SOC_RATE_THRESHOLD=30
      - SOC_AUTH_FAIL_THRESH=5
      - SOC_UA_ROTATION_THRESH=3
      - SOC_ENABLE_MONGO_PROFILING=false
      - NGINX_LOG_PATH=/var/log/nginx/access.log
    volumes:
      - qdrant_data:/app/app/agents/agent_03_sentiment/qdrant_data
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelai-frontend
    env_file:
      - ./frontend/.env
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: sentinelai-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - production

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  weaviate_data:
  qdrant_data:
  caddy_data:
  caddy_config:
